[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cyberpass-api"
version = "0.1.0"
description = "API sécurisée de gestion des preuves CyberPass"
authors = [{ name = "Plessy Vincent" }]
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "boto3>=1.35,<2",
  "defusedxml>=0.7,<1",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "openai>=1.60,<2",
  "openpyxl>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "pwdlib[argon2]>=0.2,<1",
  "PyJWT>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008", "S101"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "openpyxl", "openpyxl.*"]
ignore_missing_imports = true
