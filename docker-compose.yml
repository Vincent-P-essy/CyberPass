name: cyberpass

services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cyberpass}
      POSTGRES_USER: ${POSTGRES_USER:-cyberpass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development-only-database-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cyberpass-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-development-only-minio-password}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cyberpass-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-development-only-minio-password}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-cyberpass-app}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-development-only-storage-app-password}
      S3_BUCKET: ${S3_BUCKET:-cyberpass-evidence}
    entrypoint: ["/bin/sh", "/opt/cyberpass/minio-init.sh"]
    volumes:
      - ./infra/docker/minio-init.sh:/opt/cyberpass/minio-init.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./apps/api
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-CyberPass}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://cyberpass:development-only-database-password@postgres:5432/cyberpass}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-10}
      AUTH_IP_RATE_LIMIT: ${AUTH_IP_RATE_LIMIT:-60}
      AUTH_RATE_WINDOW_SECONDS: ${AUTH_RATE_WINDOW_SECONDS:-60}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-cyberpass-app}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-development-only-storage-app-password}
      S3_BUCKET: ${S3_BUCKET:-cyberpass-evidence}
      S3_REGION: ${S3_REGION:-eu-west-1}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      SIGNED_URL_SECONDS: ${SIGNED_URL_SECONDS:-300}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-11534336}
      JWT_SECRET: ${JWT_SECRET:-development-only-replace-with-32-random-characters}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-30}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-1200}
      GENERATION_RATE_LIMIT: ${GENERATION_RATE_LIMIT:-5}
      GENERATION_RATE_WINDOW_SECONDS: ${GENERATION_RATE_WINDOW_SECONDS:-60}
      GENERATION_CONCURRENCY_PER_TENANT: ${GENERATION_CONCURRENCY_PER_TENANT:-1}
      PUBLIC_SHARE_RATE_LIMIT: ${PUBLIC_SHARE_RATE_LIMIT:-120}
      PUBLIC_SHARE_GLOBAL_RATE_LIMIT: ${PUBLIC_SHARE_GLOBAL_RATE_LIMIT:-2000}
      PUBLIC_SHARE_RATE_WINDOW_SECONDS: ${PUBLIC_SHARE_RATE_WINDOW_SECONDS:-60}
      UPLOAD_RATE_LIMIT: ${UPLOAD_RATE_LIMIT:-30}
      DOWNLOAD_RATE_LIMIT: ${DOWNLOAD_RATE_LIMIT:-120}
      DOWNLOAD_GLOBAL_RATE_LIMIT: ${DOWNLOAD_GLOBAL_RATE_LIMIT:-2000}
      FILE_RATE_WINDOW_SECONDS: ${FILE_RATE_WINDOW_SECONDS:-60}
      TENANT_EVIDENCE_QUOTA: ${TENANT_EVIDENCE_QUOTA:-5000}
      TENANT_QUESTIONNAIRE_QUOTA: ${TENANT_QUESTIONNAIRE_QUOTA:-1000}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - local_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      INTERNAL_API_URL: http://api:8000/api/v1
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  local_uploads:
