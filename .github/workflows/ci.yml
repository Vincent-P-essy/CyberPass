name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets — repository scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  api:
    name: API — lint, types and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: python -m pytest --cov=app --cov-report=term-missing
      - run: pip-audit --path "$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"

  web:
    name: Web — lint, types, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm --workspace @cyberpass/web run format:check
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          INTERNAL_API_URL: http://api:8000/api/v1
      - run: npm audit --audit-level=high

  compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose config --quiet

  integration:
    name: Integration — real browser and API
    runs-on: ubuntu-latest
    needs: [api, web, compose]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: make setup
      - run: docker compose up --build -d
      - name: Wait for the real stack
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8000/ready >/dev/null \
              && curl --fail --silent http://localhost:3000/login >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color
          exit 1
      - name: Run the connected critical path
        run: npm --workspace @cyberpass/web run test:e2e -- real-api.spec.ts
        env:
          E2E_REAL_API: "1"
          PLAYWRIGHT_BASE_URL: http://localhost:3000
      - name: Collect container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the integration stack
        if: always()
        run: docker compose down --volumes
